name: PHPUnit tests and coverage

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: grpc
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Run tests with coverage
        run: vendor/bin/phpunit tests/

      - name: Add coverage to the job summary
        if: always() && hashFiles('build/coverage.txt') != ''
        run: |
          {
            echo "## Code coverage"
            echo
            echo '```'
            cat build/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always() && hashFiles('build/logs/clover.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: |
            build/coverage.txt
            build/logs/clover.xml
            build/coverage
          retention-days: 14
